<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoltDock - EV Charging Station Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<dialog id="dlg">
  <form id="dlgForm" method="dialog">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="actions">
      <button type="button" class="btn ghost" onclick="document.getElementById('dlg').close()">Cancel</button>
      <button class="btn" id="dlgOk">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
